name: deployment

permissions: {}

on:
  push:
    branches: [ 'main' ]

# Helps prevent parallel runs of the workflow from overlapping
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-deploy:
    name: pytest & deploy on success
    runs-on: 'ubuntu-latest'
    environment: production
    continue-on-error: false
    strategy:
      matrix:
        # Specify the test env here so that we have a single source of truth for Pixi setup and running the test suite
        environment: [ 'test-py314' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7  # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false  # Required to avoid exposing secrets to pytest run in forked PRs

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          cache: true
          environments: ${{ matrix.environment }}

      - name: Run pytest
        run: pixi run -e ${INPUTS_ENVIRONMENT} pytest
        env:
          INPUTS_ENVIRONMENT: ${{ matrix.environment }}

      - name: update & restart app via ssh
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          DEPLOY_SCRIPT: ${{ secrets.DEPLOY_PATH }}/deploy.sh
        with:
          envs: DEPLOY_SCRIPT
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: ${DEPLOY_SCRIPT}
