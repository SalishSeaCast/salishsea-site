name: deployment

permissions: {}

on:
  push:
    branches: [ 'main' ]

# Helps prevent parallel runs of the workflow from overlapping
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-deploy:
    name: pytest & deploy on success
    runs-on: 'ubuntu-latest'
    environment: production
    strategy:
      fail-fast: false
      matrix:
        # Need to specify the Python version here because we use test env, which gets its
        # Python version via matrix
        python-version: [ '3.13' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7  # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false  # Required to avoid exposing secrets to pytest run in forked PRs

      - name: Get current date for downloads cache key
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "${GITHUB_OUTPUT}"

      - name: Set up Conda environment with Micromamba
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39
        with:
           environment-file: envs/environment-test.yaml
           environment-name: salishsea-site-test
           # environment caching does not play nicely with --editable installed packages
           cache-environment: false
           cache-downloads: true
           # persist downloads cache for 1 day
           cache-downloads-key: downloads-${{ steps.date.outputs.date }}-deploy
           create-args: >-
             python=${{ matrix.python-version }}

      - name: pytest package
        shell: bash -l {0}
        run: |
          pytest

      - name: update & restart app via ssh
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_SCRIPT: ${{ secrets.DEPLOY_PATH }}/deploy.sh
        with:
          host: ${DEPLOY_HOST}
          username: ${DEPLOY_USER}
          key: ${DEPLOY_KEY}
          script: ${DEPLOY_SCRIPT}
