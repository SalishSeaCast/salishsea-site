[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "salishsea_site"
dynamic = [ "version" ]
description = """\
    Pyramid web app that serves the salishsea.eos.ubc.ca site.\
    """
readme = "README.rst"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Doug Latornell", email= "dlatornell@eoas.ubc.ca" }
]
keywords = [
    "oceanography",
    "ocean modelling",
    "UBC-MOAD",
    "Salish Sea",
    "SalishSeaCast",
    "website",
    "pyramid-framework"]
dependencies = [
    # see envs/environment-prod.yaml for conda environment production installation,
    # see envs/environment-dev.yaml for conda environment dev installation,
    # see envs/requirements.txt for package versions used during recent development
    "arrow",
    "attrs",
    "pyramid",
    "pyramid_mako",
    "pyyaml",
    "requests",
    "sentry-sdk",
    "supervisor",
    "waitress",
]

[project.urls]
"Documentation" = "https://salishsea-site.readthedocs.io"
"Changelog" = "https://github.com/SalishSeaCast/salishsea-site/releases"
"Issue Tracker" = "https://github.com/SalishSeaCast/salishsea-site/issues"
"Source Code" = "https://github.com/SalishSeaCast/salishsea-site"

[project.entry-points."paste.app_factory"]
main = "salishsea_site:main"


[tool.coverage.run]
branch = true
source = ["salishsea_site", "tests"]

[tool.coverage.report]
show_missing = true


[tool.hatch.build.targets.wheel]
include = [
    "salishsea_site",
    "images",
]

[tool.hatch.version]
path = "salishsea_site/__about__.py"


[tool.pixi.workspace]
channels = ['conda-forge']
platforms = ['linux-64', "osx-arm64"]

[tool.pixi.pypi-dependencies]
salishsea_site = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.environments.default]
channels = ["conda-forge"]

[tool.pixi.environments.default.dependencies]
arrow = ">=1.4.0,<2"
attrs = ">=26.1.0,<27"
pip = ">=26.2.2,<27"
pyramid = ">=2.1,<3"
python = "3.14.*"
pyyaml = ">=6.0.3,<7"
requests = ">=2.34.2,<3"
sentry-sdk = ">=2.75.0,<3"
supervisor = ">=4.3.0"
waitress = ">=3.0.2,<4"

[dependency-groups]
default = ["pyramid-mako"]
