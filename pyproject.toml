[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "salishsea_site"
dynamic = [ "version" ]
description = """\
    Pyramid web app that serves the salishsea.eos.ubc.ca site.\
    """
readme = "README.rst"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
    { name = "Doug Latornell", email= "dlatornell@eoas.ubc.ca" }
]
keywords = [
    "oceanography",
    "ocean modelling",
    "UBC-MOAD",
    "Salish Sea",
    "SalishSeaCast",
    "website",
    "pyramid-framework"]
dependencies = [
    "arrow",
    "attrs",
    "pyramid",
    "pyramid_mako",
    "pyyaml",
    "requests",
    "sentry-sdk",
    "supervisor",
    "waitress",
]

[project.urls]
"Documentation" = "https://salishsea-site.readthedocs.io"
"Changelog" = "https://github.com/SalishSeaCast/salishsea-site/releases"
"Issue Tracker" = "https://github.com/SalishSeaCast/salishsea-site/issues"
"Source Code" = "https://github.com/SalishSeaCast/salishsea-site"

[project.entry-points."paste.app_factory"]
main = "salishsea_site:main"


[tool.coverage.run]
branch = true
source = ["salishsea_site", "tests"]
omit = [ ".pixi/*", "src/*" ]

[tool.coverage.report]
show_missing = true


[tool.hatch.build.targets.wheel]
include = [
    "salishsea_site",
    "images",
]

[tool.hatch.version]
path = "salishsea_site/__about__.py"


[tool.pixi.workspace]
channels = ['conda-forge']
platforms = ['linux-64', "osx-arm64"]

[tool.pixi.pypi-dependencies]
salishsea_site = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.environments]
test-py314 = ["py314", "test"]
docs = { features = ["docs"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.environments.default]
channels = ["conda-forge"]

[tool.pixi.environments.default.dependencies]
arrow = ">=1.4.0,<2"
attrs = ">=26.1.0,<27"
pip = ">=26.2.2,<27"
pyramid = ">=2.1,<3"
python = "3.14.*"
pyyaml = ">=6.0.3,<7"
requests = ">=2.34.2,<3"
sentry-sdk = ">=2.75.0,<3"
setuptools = "<82"
supervisor = ">=4.3.0"
waitress = ">=3.0.2,<4"

[dependency-groups]
default = ["pyramid-mako"]
docs = ["sphinx-rtd-theme==3.1.0"]
dev = ["sphinx-rtd-theme==3.1.0"]

[tool.pixi.feature.test.dependencies]
pytest = ">=9.2.0,<10"
pytest-cov = ">=7.1.0,<8"
tomli = ">=2.5.0,<3"

[tool.pixi.feature.test.tasks]
pytest = "pytest"
pytest-cov = "pytest --cov=./"
pytest-cov-html = "pytest --cov=./ --cov-report html"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.docs.dependencies]
docutils = "0.22.4.*"
sphinx = "9.1.0.*"
sphinx-copybutton = ">=0.5.2,<0.6"
sphinx-notfound-page = "1.1.0.*"
commonmark = "0.9.1.*"
recommonmark = "0.7.1.*"
mock = "5.2.0.*"
pillow = "12.2.0.*"

[tool.pixi.feature.docs.tasks]
docs = { cmd = "make clean html", cwd = "docs/" }
linkcheck = { cmd = "make clean linkcheck", cwd = "docs/" }

[tool.pixi.feature.dev.dependencies]
pyramid_debugtoolbar = ">=4.9,<5"
# For coding style, repo QA, and pkg management
black = ">=26.10.1,<27"
hatch = ">=1.18.2,<2"
pip = ">=26.2.2,<27"
pre-commit = ">=4.7.0,<5"
pytest = ">=9.2.0,<10"
pytest-cov = ">=7.1.0,<8"
pytest-randomly = ">=5.1.0,<6"
tomli = ">=2.5.0,<3"
# For documentation links checking
docutils = "0.22.4.*"
sphinx = "9.1.0.*"
sphinx-copybutton = ">=0.5.2,<0.6"
sphinx-notfound-page = "1.1.0.*"
commonmark = "0.9.1.*"
recommonmark = "0.7.1.*"
mock = "5.2.0.*"
pillow = "12.2.0.*"

[tool.pixi.feature.dev.tasks]
pytest = "pytest --randomly-seed=last"
